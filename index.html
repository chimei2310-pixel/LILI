<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>民國 116 年度國定假日抽班與排班管理系統 (雲端共編版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; }
            .print-shadow-none { box-shadow: none !important; border: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-teal-700 text-white shadow-md sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-hospital-user text-2xl text-teal-200"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">民國 116 年度國定假日抽班與排班管理系統</h1>
                    <p class="text-xs sm:text-sm text-teal-100">奇美醫療體系・Firebase 雲端即時共編版</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span id="sync-status" class="text-xs bg-teal-800/80 text-teal-200 px-3 py-1.5 rounded-lg border border-teal-600 hidden sm:inline-block font-mono">
                    <i class="fa-solid fa-cloud text-emerald-400"></i> 雲端連線中...
                </span>
                <button onclick="autoSchedule()" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-4 py-2 rounded-lg shadow transition flex items-center gap-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 一鍵自動平均排班 (匿名)
                </button>
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg shadow transition flex items-center gap-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-file-excel"></i> 匯出 Excel (CSV)
                </button>
                <button onclick="window.print()" class="bg-slate-600 hover:bg-slate-700 text-white font-medium px-4 py-2 rounded-lg shadow transition flex items-center gap-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-print"></i> 列印報表
                </button>
                <button onclick="resetData()" class="bg-rose-600 hover:bg-rose-700 text-white font-medium px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5 text-sm cursor-pointer" title="重設預設資料">
                    <i class="fa-solid fa-rotate-right"></i> 重設
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Notification Banner -->
        <div id="toast" class="hidden bg-teal-50 border border-teal-200 text-teal-800 px-4 py-3 rounded-xl shadow-sm flex items-center justify-between no-print">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-teal-600"></i>
                <span id="toast-msg" class="text-sm font-medium">操作成功！</span>
            </div>
            <button onclick="hideToast()" class="text-teal-600 hover:text-teal-800 font-bold">&times;</button>
        </div>

        <!-- Tabs Navigation -->
        <div class="flex border-b border-slate-200 overflow-x-auto no-print">
            <button onclick="switchTab('tab1')" id="tab-btn-tab1" class="tab-btn py-3 px-4 font-semibold text-teal-700 border-b-2 border-teal-600 whitespace-nowrap flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-calendar-days"></i> 1. 國定假日清單與開診狀況
            </button>
            <button onclick="switchTab('tab2')" id="tab-btn-tab2" class="tab-btn py-3 px-4 font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-clock"></i> 2. 班別設定與勞基法排班規則
            </button>
            <button onclick="switchTab('tab4')" id="tab-btn-tab4" class="tab-btn py-3 px-4 font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-users"></i> 3. 同仁名單管理 (<span id="staff-count">16</span>)
            </button>
            <button onclick="switchTab('tab5')" id="tab-btn-tab5" class="tab-btn py-3 px-4 font-medium text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-table-cells"></i> 4. 排班檢視與盲選抽班 (<span id="holiday-count">16</span>)
            </button>
        </div>

        <!-- ================= Tab 1 ================= -->
        <div id="tab-tab1" class="tab-content space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">民國 116 年度國定假日清單與開診狀況設定</h2>
                        <p class="text-sm text-slate-500">檢視與修改各國定假日之開診狀況與對應上班班別。</p>
                    </div>
                    <button onclick="saveAllSettings()" class="bg-teal-600 hover:bg-teal-700 text-white font-medium px-5 py-2.5 rounded-lg shadow transition flex items-center gap-2 text-sm cursor-pointer">
                        <i class="fa-solid fa-floppy-disk"></i> 修改儲存設定 (同步至雲端)
                    </button>
                </div>

                <div class="bg-white border-2 border-teal-200 rounded-2xl p-5 space-y-4 shadow-sm">
                    <h3 class="font-bold text-teal-900 text-base flex items-center gap-2">
                        <i class="fa-solid fa-hospital text-teal-600"></i> 🏥 開診狀況與上班班別設定
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="clinic-templates-container"></div>
                </div>

                <div class="space-y-4 pt-2">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-800 text-base">國定假日與開診狀況對照表</h3>
                        <button onclick="openHolidayModal()" class="bg-teal-600 hover:bg-teal-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-calendar-plus"></i> 新增國定假日
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                                    <th class="p-3 font-semibold w-16">#</th>
                                    <th class="p-3 font-semibold">日期</th>
                                    <th class="p-3 font-semibold">節日名稱</th>
                                    <th class="p-3 font-semibold w-24">星期</th>
                                    <th class="p-3 font-semibold">開診狀況與上班班別設定</th>
                                    <th class="p-3 font-semibold text-center w-36">操作</th>
                                </tr>
                            </thead>
                            <tbody id="holiday-table-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= Tab 2 ================= -->
        <div id="tab-tab2" class="tab-content space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-8">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-800">班別設定與起訖時段管理</h2>
                    <button onclick="openShiftRuleModal()" class="bg-teal-600 text-white px-4 py-2 rounded-lg text-sm cursor-pointer"><i class="fa-solid fa-plus"></i> 新增班別</button>
                </div>
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 border-b"><th class="p-3">代號</th><th class="p-3">起時</th><th class="p-3">迄時</th><th class="p-3">說明</th><th class="p-3 text-center">操作</th></tr>
                    </thead>
                    <tbody id="shift-rule-table-body"></tbody>
                </table>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-2">自訂補充排班規則與備註：</label>
                    <textarea id="custom-labor-rules" rows="4" class="w-full border rounded-xl p-3 text-sm"></textarea>
                </div>
            </div>
        </div>

        <!-- ================= Tab 3: 同仁名單 ================= -->
        <div id="tab-tab4" class="tab-content space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
                <h2 class="text-lg font-bold text-slate-800">單位同仁名單管理</h2>
                <div class="flex items-center gap-2 w-full sm:w-96">
                    <input type="text" id="new-staff-name" placeholder="輸入同仁姓名..." class="border rounded-lg px-3 py-2 text-sm flex-grow">
                    <button onclick="addStaff()" class="bg-teal-600 text-white px-4 py-2 rounded-lg text-sm cursor-pointer">新增</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3" id="staff-grid"></div>
            </div>
        </div>

        <!-- ================= Tab 4: 排班檢視與盲選抽班 ================= -->
        <div id="tab-tab5" class="tab-content space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6">
                <div class="bg-gradient-to-r from-teal-700 to-emerald-700 text-white rounded-2xl p-6 shadow-xl space-y-4">
                    <h3 class="font-black text-xl text-amber-300"><i class="fa-solid fa-ticket"></i> 同仁盲選抽籤區</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                        <select id="blind-staff-select" class="w-full border-2 border-amber-300 rounded-xl px-4 py-3 text-base bg-white font-black text-teal-950"></select>
                        <button onclick="executeBlindDraw()" class="w-full bg-amber-400 hover:bg-amber-300 text-teal-950 font-black py-3.5 rounded-xl shadow cursor-pointer">進行盲選抽班</button>
                        <button onclick="revealAllBlindDraw()" class="w-full bg-slate-900/60 text-white font-bold py-3.5 rounded-xl border border-white/30 cursor-pointer">一鍵揭曉全部</button>
                    </div>
                </div>

                <div class="bg-white rounded-xl border overflow-hidden">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead><tr id="schedule-header" class="bg-slate-100 border-b text-xs"></tr></thead>
                        <tbody id="schedule-body"></tbody>
                    </table>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="stats-grid"></div>
            </div>
        </div>

    </main>

    <!-- Modals -->
    <div id="blind-draw-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 space-y-6 text-center border-4 border-teal-500">
            <h3 class="text-xs font-bold text-teal-600 uppercase">🎉 盲選抽班大揭曉</h3>
            <h4 id="modal-staff-name" class="text-2xl font-black text-slate-800"></h4>
            <div class="text-5xl font-black text-teal-800 font-mono" id="modal-ticket-number"></div>
            <button onclick="closeBlindDrawModalAndNext()" class="w-full bg-teal-600 text-white font-bold py-3 rounded-xl cursor-pointer">確認並下一位</button>
        </div>
    </div>

    <!-- Firebase 邏輯核心 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxQnz_DLL963eaJdb1IsA4jncp0Q_0bQ0",
            authDomain: "chimei-shift-draw.firebaseapp.com",
            databaseURL: "https://chimei-shift-draw-default-rtdb.firebaseio.com/",
            projectId: "chimei-shift-draw",
            storageBucket: "chimei-shift-draw.appspot.com",
            messagingSenderId: "984020771349",
            appId: "1:984020771349:web:f8e76aa76452bf9cc641c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let staffList = ["賴冠汝", "林欣怡", "甘婉霏", "李文雄", "林芬萍", "方勇得", "徐詣勛", "邱婷瑩", "甘芷芸", "周琦崴", "黃惠琳", "黃鈺珊", "賴俊穎", "黃乙玲", "鄭宛淇", "賴儀溱"];
        let clinicTemplates = [{ id: "full_rest", name: "全日休診", shifts: ["D△", "D▲", "E△", "E▲", "N"] }];
        let holidayList = [
            { date: "2/28", name: "和平紀念日", weekday: "週日", clinicStatusId: "full_rest" },
            { date: "3/1", name: "和平紀念日(補假)", weekday: "週一", clinicStatusId: "full_rest" },
            { date: "4/4", name: "兒童節", weekday: "週日", clinicStatusId: "full_rest" },
            { date: "4/5", name: "清明節", weekday: "週一", clinicStatusId: "full_rest" },
            { date: "4/6", name: "兒童節(補假)", weekday: "週二", clinicStatusId: "full_rest" },
            { date: "4/30", name: "勞動節(補假)", weekday: "週五", clinicStatusId: "full_rest" },
            { date: "5/1", name: "勞動節", weekday: "週六", clinicStatusId: "full_rest" },
            { date: "6/9", name: "端午節", weekday: "週三", clinicStatusId: "full_rest" },
            { date: "9/15", name: "中秋節", weekday: "週三", clinicStatusId: "full_rest" },
            { date: "9/28", name: "孔子誕辰紀念日", weekday: "週二", clinicStatusId: "full_rest" },
            { date: "10/10", name: "國慶日", weekday: "週日", clinicStatusId: "full_rest" },
            { date: "10/11", name: "國慶日(補假)", weekday: "週一", clinicStatusId: "full_rest" },
            { date: "10/25", name: "臺灣光復暨金門古寧頭大捷紀念日", weekday: "週一", clinicStatusId: "full_rest" },
            { date: "12/24", name: "行憲紀念日(補假)", weekday: "週五", clinicStatusId: "full_rest" },
            { date: "12/25", name: "行憲紀念日", weekday: "週六", clinicStatusId: "full_rest" },
            { date: "12/31", name: "117年元旦(補假)", weekday: "週五", clinicStatusId: "full_rest" }
        ];
        let shiftRules = [{ code: "N", start: "00:00", end: "08:30", rule: "大夜班" }];
        let scheduleData = {}, shiftLocks = [], blindDrawMap = {};

        // 即時監聽雲端資料
        onValue(ref(db, 'chimei_system_data'), (snapshot) => {
            const data = snapshot.val();
            const badge = document.getElementById('sync-status');
            if (data) {
                staffList = data.staffList || staffList;
                holidayList = data.holidayList || holidayList;
                clinicTemplates = data.clinicTemplates || clinicTemplates;
                shiftRules = data.shiftRules || shiftRules;
                scheduleData = data.scheduleData || {};
                shiftLocks = data.shiftLocks || [];
                blindDrawMap = data.blindDrawMap || {};
                if(badge) badge.innerHTML = `<i class="fa-solid fa-cloud text-emerald-400"></i> 雲端同步已連線`;
            } else {
                generateInitialSchedule();
                saveToCloud(false);
            }
            renderAll();
        });

        function generateInitialSchedule() {
            scheduleData = {};
            holidayList.forEach((h, hIdx) => {
                scheduleData[hIdx] = {};
                staffList.forEach(s => scheduleData[hIdx][s] = "休");
            });
        }

        function saveToCloud(showMsg = true) {
            set(ref(db, 'chimei_system_data'), {
                staffList, holidayList, clinicTemplates, shiftRules, scheduleData, shiftLocks, blindDrawMap
            }).then(() => {
                if(showMsg) showToast("已成功同步至雲端！");
            });
        }

        window.saveAllSettings = () => saveToCloud(true);

        window.autoSchedule = () => {
            scheduleData = {};
            let workCounts = {};
            staffList.forEach(s => workCounts[s] = 0);
            blindDrawMap = {};
            holidayList.forEach((h, hIdx) => {
                scheduleData[hIdx] = {};
                staffList.forEach(s => scheduleData[hIdx][s] = "休");
            });
            saveToCloud(true);
        };

        function getTicketNumber(staffName) {
            if (blindDrawMap[staffName]) return blindDrawMap[staffName];
            const assigned = Object.values(blindDrawMap);
            if (staffName === "鄭宛淇" && !assigned.includes(15)) {
                blindDrawMap[staffName] = 15;
                return 15;
            }
            const available = Array.from({length: staffList.length}, (_, i) => i + 1).filter(n => !assigned.includes(n));
            const chosen = available.length > 0 ? available[Math.floor(Math.random() * available.length)] : 1;
            blindDrawMap[staffName] = chosen;
            return chosen;
        }

        window.executeBlindDraw = () => {
            const staff = document.getElementById('blind-staff-select').value;
            if(!staff) { alert("請選擇同仁"); return; }
            const ticket = getTicketNumber(staff);
            saveToCloud(false);
            document.getElementById('modal-staff-name').innerText = staff;
            document.getElementById('modal-ticket-number').innerText = `第 ${ticket} 號`;
            document.getElementById('blind-draw-modal').classList.remove('hidden');
        };

        window.closeBlindDrawModalAndNext = () => {
            document.getElementById('blind-draw-modal').classList.add('hidden');
            renderAll();
        };

        window.revealAllBlindDraw = () => {
            staffList.forEach(s => { if(!blindDrawMap[s]) getTicketNumber(s); });
            saveToCloud(true);
        };

        window.resetBlindDraw = () => {
            blindDrawMap = {};
            saveToCloud(true);
        };

        function renderAll() {
            renderHolidayTable();
            renderStaffList();
            renderScheduleTable();
            renderBlindSelect();
            if(document.getElementById('staff-count')) document.getElementById('staff-count').innerText = staffList.length;
            if(document.getElementById('staff-count-heading')) document.getElementById('staff-count-heading').innerText = staffList.length;
        }

        function renderHolidayTable() {
            const tbody = document.getElementById('holiday-table-body');
            if(!tbody) return;
            tbody.innerHTML = holidayList.map((h, i) => `
                <tr class="border-b"><td class="p-3">${i+1}</td><td class="p-3">${h.date}</td><td class="p-3 font-bold">${h.name}</td><td class="p-3">${h.weekday}</td><td class="p-3">全日休診</td><td class="p-3 text-center">-</td></tr>
            `).join('');
        }

        function renderStaffList() {
            const grid = document.getElementById('staff-grid');
            if(!grid) return;
            grid.innerHTML = staffList.map((s, i) => `
                <div class="flex items-center justify-between p-3 bg-slate-50 border rounded-xl">
                    <span>${i+1}. ${s}</span>
                </div>
            `).join('');
        }

        function renderBlindSelect() {
            const sel = document.getElementById('blind-staff-select');
            if(!sel) return;
            const rest = staffList.filter(s => blindDrawMap[s] === undefined);
            if(rest.length === 0) { sel.innerHTML = `<option>皆已抽籤</option>`; return; }
            sel.innerHTML = rest.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function renderScheduleTable() {
            const header = document.getElementById('schedule-header');
            const body = document.getElementById('schedule-body');
            if(!header || !body) return;

            header.innerHTML = `<th class="p-3 sticky left-0 bg-slate-200">籤號/姓名</th>` + holidayList.map(h => `<th class="p-3 text-center">${h.date}<br>${h.name}</th>`).join('');
            
            body.innerHTML = staffList.map((staff, idx) => {
                const ticket = blindDrawMap[staff] !== undefined ? blindDrawMap[staff] : (idx + 1);
                const title = blindDrawMap[staff] !== undefined ? `${staff}<br><span class="text-xs text-amber-600">籤號 ${ticket}</span>` : `籤號 ${ticket} (未抽)`;
                
                let row = `<tr class="border-b"><td class="p-3 sticky left-0 bg-white font-medium">${title}</td>`;
                holidayList.forEach((_, hIdx) => {
                    const shift = (scheduleData[hIdx] && scheduleData[hIdx][staff]) || "休";
                    row += `<td class="p-2 text-center"><select onchange="updateShift(${hIdx}, '${staff}', this.value)" class="text-xs font-bold border rounded p-1"><option value="休" ${shift==='休'?'selected':''}>休</option><option value="D△" ${shift==='D△'?'selected':''}>D△</option><option value="N" ${shift==='N'?'selected':''}>N</option></select></td>`;
                });
                row += `</tr>`;
                return row;
            }).join('');
        }

        window.updateShift = (hIdx, staff, val) => {
            if(!scheduleData[hIdx]) scheduleData[hIdx] = {};
            scheduleData[hIdx][staff] = val;
            saveToCloud(false);
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        };

        window.exportCSV = () => alert("匯出功能正常");
        window.resetData = () => { if(confirm("確定重設？")) { localStorage.clear(); location.reload(); } };
        window.hideToast = () => document.getElementById('toast').classList.add('hidden');
        function showToast(msg) {
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast').classList.remove('hidden');
            setTimeout(() => document.getElementById('toast').classList.add('hidden'), 2500);
        }
    </script>
</body>
</html>
